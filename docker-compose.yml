services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medivision
      POSTGRES_USER: medivision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medivision -d medivision"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://medivision:${POSTGRES_PASSWORD}@db:5432/medivision
      API_KEY: ${MEDIVISION_API_KEY:?Set MEDIVISION_API_KEY in .env}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      UPLOAD_FILE_LIMIT: ${UPLOAD_FILE_LIMIT:-20}
    command: ["sh", "-c", "alembic upgrade head && uvicorn backend.app:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
